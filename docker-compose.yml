version: '3.8'
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/contacts.db:/app/contacts.db
    environment:
      - NODE_ENV=development
networks:
  app-network:
    driver: bridge

